# Type-check and run the full Raft suite on Lua 5.4 and LuaJIT (5.1).
#
# The tlua compiler is built from the TypeLua repository. LuaJIT is installed
# because the suite is also a portability test: the same 48 cases must pass
# with --target 5.1 (no floor division, no 5.4-only syntax).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout TypeLua (compiler)
        uses: actions/checkout@v4
        with:
          repository: types-lua/TypeLua
          path: .typelua/TypeLua

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .typelua/TypeLua/go.mod
          cache: true
          cache-dependency-path: .typelua/TypeLua/go.sum

      - name: Install Lua interpreters
        run: sudo apt-get update && sudo apt-get install -y lua5.4 luajit

      - name: Build tlua
        run: go build -o /tmp/tlua ./cmd/tlua
        working-directory: .typelua/TypeLua

      - name: Type-check (strict)
        run: /tmp/tlua check

      - name: Test on Lua 5.4
        run: /tmp/tlua test

      - name: Test on LuaJIT / target 5.1
        run: /tmp/tlua test --target 5.1 --lua luajit

      - name: Build and run the demo (5.4)
        run: |
          /tmp/tlua build
          lua5.4 dist/main.lua

      - name: Run the quickstart (5.4)
        run: /tmp/tlua example quickstart

      - name: Run the quickstart (5.1 / LuaJIT)
        run: /tmp/tlua example quickstart --target 5.1 --lua luajit
